<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark slate base badge -->
  <path d="M32 4L10 14V30C10 44.5 19.5 56 32 60C44.5 56 54 44.5 54 30V14L32 4Z" fill="#090E1A" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Subtle interior cyber matrix gradient -->
  <path d="M32 8L14 16.5V30C14 42 22 52 32 55.5C42 52 50 42 50 30V16.5L32 8Z" fill="url(#glowGrad)"/>

  <!-- Radar reticle ring -->
  <circle cx="32" cy="31" r="11" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.65"/>

  <!-- Center Cyber Node -->
  <circle cx="32" cy="31" r="3" fill="#06B6D4"/>

  <!-- Radar Pulse Vector Line -->
  <path d="M21 31H27L29.5 25L34.5 37L37 31H43" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyan Guard Nodes -->
  <circle cx="32" cy="14" r="1.8" fill="#38BDF8"/>
  <circle cx="21" cy="20" r="1.2" fill="#06B6D4" opacity="0.8"/>
  <circle cx="43" cy="20" r="1.2" fill="#06B6D4" opacity="0.8"/>
</svg>
